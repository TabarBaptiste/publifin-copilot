name: API image

# Pull request: build only (checks the Dockerfile). Push to main: build and publish to GHCR.
on:
  pull_request:
    paths: [apps/api/**, .github/workflows/docker.yml]
  push:
    branches: [main]
    paths: [apps/api/**, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/publifin-api

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publish with the job's own token: no secret stored in the repository
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: apps/api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
