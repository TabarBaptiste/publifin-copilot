name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    # Real PostgreSQL for the agent integration tests (audit log, checkpoints).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: publifin
          POSTGRES_PASSWORD: publifin
          POSTGRES_DB: publifin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U publifin" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://publifin:publifin@localhost:5432/publifin
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # Evaluation gate (no LLM in CI): question set valid, committed results up to date
      # and above the quality bar. Results are produced locally with scripts/evaluate.py.
      - run: uv run python scripts/check_eval.py

  web:
    name: Web (lint + types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # LayoutProps/PageProps are generated by Next: create them before type-checking.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
      - run: terraform fmt -check -recursive
        working-directory: infra
      # No cloud login: `validate` checks the syntax and the wiring between modules only.
      # `terraform plan` needs Azure credentials (OIDC, phase 3 with the real account).
      - run: terraform init -backend=false -input=false
        working-directory: infra/envs/dev
      - run: terraform validate
        working-directory: infra/envs/dev
