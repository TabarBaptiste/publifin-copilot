[project]
name = "publifin-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "azure-identity>=1.27.0",
    "azure-search-documents>=12.1.0",
    "chromadb>=1.5.9",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "openai>=3.55.0",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"rag/sources.py" = ["E501"]  # long URLs
